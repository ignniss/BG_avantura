<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БГА 13</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-image: url('./bg4.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .puzzle-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin: 20px 0;
        }
        .puzzle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .puzzle-label {
            font-size: 1.6em;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }
        .puzzle-img {
            width: auto;
            max-width: 85%;
            height: auto;
            max-height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            object-fit: contain;
        }
        .math-poem {
            font-family: 'Courier New', monospace;
            font-size: 1.15em;
            line-height: 1.8;
            text-align: center;
            color: #f0f0f0;
        }
        .math-poem .formula-block {
            display: block;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .math-poem sup {
            font-size: 0.55em;
            vertical-align: super;
            line-height: 0;
            font-weight: bold;
        }
    </style>
<base target="_blank">
</head>
<body style="display: none;" id="mainBody">
    <script src="common.js"></script>
    <script>
        window.trenutniNivo = 13;
        if (!blokirajStranicu(window.trenutniNivo)) {
            document.getElementById('mainBody').style.display = 'block';
        }
    </script>

    <div class="overlay-modern">
        <div class="level-header">
    <div class="logo-inside">
        <a href="index.html"><img src="logo.png" alt="BG авантура лого" /></a>
    </div>
    <h1 class="nivo-naslov" data-i18n="nivo13_title">ПОГЛЕД НА ПРОШЛОСТ</h1>
</div>
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

        <div class="header-bar">
            <div class="timer-box">
                <span class="timer-icon">⏱️</span>
                <div class="tajmer" id="tajmer">0:00:00</div>
                <button class="restart-timer-btn" title="Рестартуј време" onclick="restartujVreme(document.getElementById('poruka'))">↻</button>
            </div>
            <div class="level-badge"></div>
        </div>

        <div class="location-info-box">
            <button class="location-toggle-btn" id="locToggleBtn" onclick="toggleLocationInfo()">
                <span data-i18n="btn_location13">О Цркви Светог Марка</span> <span class="arrow">▼</span>
            </button>
            <div data-i18n="nivo13_location" class="location-text" id="locText"></div>
        </div>

        <div class="puzzle-gallery">
            <div class="puzzle-item">
                <span class="puzzle-label">A</span>
                <img src="grifonl.png" alt="Grifon levo" class="puzzle-img">
            </div>
            <div class="puzzle-item">
                <span class="puzzle-label">B</span>
                <img src="grifond.png" alt="Grifon desno" class="puzzle-img">
            </div>
            <div class="puzzle-item">
                <span class="puzzle-label">C</span>
                <img src="ptica.png" alt="Ptica" class="puzzle-img">
            </div>
            <div class="puzzle-item">
                <span class="puzzle-label">D</span>
                <img src="andjeo.png" alt="Andjeo" class="puzzle-img">
            </div>
        </div>
        <div class="pitanje-card math-poem" data-i18n-html="nivo13_poem">
            E,F = рече господ… (N-E)<br>
            G,H = рече господ… (S-W)<br>
            <span class="formula-block">
                G·H − E·F + D<sup>B−C</sup> + A = ?<br>
                1 = O, 3 = K
            </span>
        </div>

        <div class="hintovi">
            <button class="hint-btn" id="hint1" onclick="pokaziHint(1)" data-i18n="btn_help1">ПОМОЋ 1</button>
            <button class="hint-btn" id="hint2" onclick="pokaziHint(2)" data-i18n="btn_help2">ПОМОЋ 2</button>
            <button class="hint-btn" id="hint3" onclick="pokaziHint(3)" data-i18n="btn_help3">ПОМОЋ 3</button>
            <button class="hint-btn" id="hint4" onclick="pokaziHint(4)" data-i18n="btn_help4">ПОМОЋ 4</button>
            <button class="hint-btn" id="hint5" onclick="pokaziHint(5)" data-i18n="btn_help5">ПОМОЋ 5</button>
            <button class="hint-btn" id="hint6" onclick="pokaziHint(6)" data-i18n="btn_help6">ПОМОЋ 6</button>
            <button class="hint-btn-final" id="hintFinal" onclick="pokaziFinalHint()" data-i18n="final_hint_btn">КОНАЧНА ПОМОЋ</button>
        </div>

        <div class="forma">
            <input type="text" maxlength="20" class="input-polje" id="odgovorInput" data-i18n-placeholder="input_placeholder" placeholder="Унесите одговор...">
        </div>

        <div id="poruka" class="hint-poruka" style="display: none;"></div>

        <button class="proveri-btn" id="proveriBtn" onclick="proveri()" data-i18n="btn_check">ПРОВЕРИ ОДГОВОР</button>

    </div>

    <script>
        postaviProgress(trenutniNivo);
        inicijalizujTimer(document.getElementById('tajmer'));

        const porukaElement = document.getElementById('poruka');
        const proveriBtn = document.getElementById('proveriBtn');
        const input = document.getElementById('odgovorInput');

        let finalHintTimer = null;
        let finalHintSeconds = 0;
        let finalHintState = 'idle';

        document.querySelectorAll('.hint-btn, .hint-btn-final').forEach(btn => btn.disabled = false);
        input.value = '';
        porukaElement.style.display = 'none';
        proveriBtn.disabled = false;
        input.disabled = false;

        postaviEnterHandler(input, proveri);

        function toggleLocationInfo() {
            const btn = document.getElementById('locToggleBtn');
            const text = document.getElementById('locText');
            btn.classList.toggle('open');
            text.classList.toggle('open');
        }

        (function obradiLokaciju() {
            const locText = document.getElementById('locText');
            const rawText = locText.textContent.trim();
            if (!rawText || rawText === 'nivo13_location') {
                setTimeout(obradiLokaciju, 100);
                return;
            }
            if (rawText.includes('<br')) {
                const paragraphs = rawText.split(/<br\s*\/?>/i);
                locText.innerHTML = paragraphs.map(p => p.trim() ? `<p>${p.trim()}</p>` : '').join('');
            } else if (locText.innerHTML.includes('<br')) {
                const paragraphs = locText.innerHTML.split(/<br\s*\/?>/i);
                locText.innerHTML = paragraphs.map(p => {
                    const clean = p.replace(/<[^>]+>/g, '').trim();
                    return clean ? `<p>${clean}</p>` : '';
                }).join('');
            } else if (rawText.includes('\n')) {
                const paragraphs = rawText.split(/\n+/);
                locText.innerHTML = paragraphs.map(p => p.trim() ? `<p>${p.trim()}</p>` : '').join('');
            } else {
                locText.innerHTML = `<p>${rawText}</p>`;
            }
        })();

        function pokaziHint(br) {
            const btn = document.getElementById('hint' + br);
            if (btn.disabled) return;
            btn.disabled = true;
            let key = 'nivo13_hint' + br;
            prikaziPoruku(porukaElement, t(key), 'info');
        }

        function pokaziFinalHint() {
            const btn = document.getElementById('hintFinal');
            if (finalHintState === 'idle') {
                finalHintState = 'countdown';
                finalHintSeconds = 15;
                btn.classList.add('countdown');
                prikaziPoruku(porukaElement, `<strong>${t('final_hint_confirm_title')}</strong><br>${t('final_hint_confirm_answer')}`, 'info');
                updateFinalHintButton();
                finalHintTimer = setInterval(() => {
                    finalHintSeconds--;
                    updateFinalHintButton();
                    if (finalHintSeconds <= 0) {
                        clearInterval(finalHintTimer);
                        finalHintState = 'ready';
                        btn.classList.remove('countdown');
                        btn.textContent = t('btn_reveal_answer');
                        prikaziPoruku(porukaElement, t('final_hint_ready_answer'), 'info');
                    }
                }, 1000);
            } else if (finalHintState === 'countdown') {
                clearInterval(finalHintTimer);
                finalHintState = 'idle';
                btn.classList.remove('countdown');
                btn.textContent = t('final_hint_btn');
                prikaziPoruku(porukaElement, t('final_hint_cancelled'), 'info');
            } else if (finalHintState === 'ready') {
                btn.disabled = true;
                prikaziPoruku(porukaElement, `${t('final_hint_coordinates')}<br><span style="color:#f39c12; font-weight:bold; font-size:1.4em;">${t('nivo13_final_hint')}</span>`, 'info');
            }
        }

        function updateFinalHintButton() {
            const btn = document.getElementById('hintFinal');
            if (finalHintState === 'countdown') {
                btn.textContent = t('final_hint_countdown', {s: finalHintSeconds});
            }
        }

        function proveri() {
            let unos = input.value.trim().toLowerCase();
            if (unos === '') {
                prikaziPoruku(porukaElement, t('msg_wrong'), 'error');
                return;
            }

            unos = unos.replace(/о/g, 'o').replace(/к/g, 'k');
            
            const normalizovan = unos.replace(/\s+/g, '');

            if (normalizovan === 'oko') {
                prikaziPoruku(porukaElement, t('msg_correct'), 'success');
                const hintBtn1 = document.getElementById('hint1');
                const hintBtn2 = document.getElementById('hint2');
                const hintBtn3 = document.getElementById('hint3');
                const hintBtn4 = document.getElementById('hint4');
                const hintBtn5 = document.getElementById('hint5');
                const hintBtn6 = document.getElementById('hint6');
                const hintFinal = document.getElementById('hintFinal');
                onemoguciInterakciju(proveriBtn, input, [hintBtn1, hintBtn2, hintBtn3, hintBtn4, hintBtn5, hintBtn6, hintFinal]);
                oznaciKaoZavrseno(13);
                setTimeout(() => { window.location.href = 'intro2.html'; }, 4000);
            } else {
                prikaziPoruku(porukaElement, t('msg_wrong'), 'error');
            }
        }
    </script>
</body>
</html>
